name: Backend tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      TZ: UTC
      # Schema generation only; tests never connect to this database.
      DATABASE_URL: postgresql://unit:unit@127.0.0.1:1/unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run test:typecheck
      - run: npm run test:unit:coverage
      - run: npm run test:regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/unit
          retention-days: 14

  infrastructure:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@127.0.0.1:15432/kwonserver_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run test:infrastructure
      - name: Ensure test containers are removed
        if: always()
        run: docker compose -f tests/docker-compose.yml down --volumes --remove-orphans
