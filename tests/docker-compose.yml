name: kwonserver-tests
services:
  postgres:
    image: ${TEST_POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: kwonserver_test
      PGDATA: /var/lib/postgresql/data
    ports: ["127.0.0.1:15432:5432"]
    tmpfs: ["/var/lib/postgresql/data:uid=1000,gid=1000"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U test -d kwonserver_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:16379:6379"]
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
